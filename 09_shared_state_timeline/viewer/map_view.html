<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rafael Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0e1318;--panel:#151c23;--panel2:#1b242d;--line:#2a3541;--fg:#e6edf3;--muted:#8b9aa8;--acc:#4fb3d9;--warn:#f2b632;--bad:#e5534b;--ok:#3fb27f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:270px 1fr 330px;grid-template-rows:auto 1fr auto;height:100vh}
#top{grid-column:1/4;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#clock{font:600 20px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.02em}
#clock small{display:block;font:500 12px system-ui;color:var(--muted);letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.chip b{font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
#alerts{display:flex;gap:6px;flex-wrap:wrap;max-width:46vw}
.alert{background:#5c1a1a;border-color:#a33;color:#ffd9d6}.alert.adv{background:#4d3c10;border-color:#8a6d1c;color:#ffe9b0}
#left,#right{background:var(--panel);overflow:auto;padding:10px 12px}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
h3{margin:12px 0 6px;font:700 11px system-ui;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h3:first-child{margin-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;background:var(--panel2);color:var(--fg);border:0;border-right:1px solid var(--line);padding:6px 2px;font:600 12px system-ui;cursor:pointer}
.seg button:last-child{border-right:0}.seg button.on{background:var(--acc);color:#06222d}
.layer{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;user-select:none}
.layer input{accent-color:var(--acc);margin:0}.layer .n{margin-left:auto;color:var(--muted);font:600 11px ui-monospace,Consolas,monospace}
.layer.off{opacity:.38;cursor:not-allowed}.layer svg{flex:none}
.sub{margin-left:22px}
.slider{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:6px;margin:3px 0;color:var(--muted)}
.slider input{width:100%;accent-color:var(--acc)}
#mapwrap{position:relative;overflow:hidden;background:#0b2233}
#map{position:absolute;inset:0;background:transparent}
canvas.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#base{z-index:0}#map{z-index:2}#wxc{z-index:450}#night{z-index:449;background:#03101f;opacity:0;transition:opacity .4s}#assets{z-index:460}
.leaflet-container{background:transparent}
.leaflet-control-attribution{background:rgba(10,15,20,.6)!important;color:#9ab!important}
#tip{position:absolute;z-index:470;pointer-events:none;background:rgba(10,16,22,.93);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:280px;display:none;font-size:12px}
#loading{position:absolute;z-index:480;left:50%;top:12px;transform:translateX(-50%);background:rgba(10,16,22,.9);border:1px solid var(--line);border-radius:999px;padding:4px 12px;display:none}
#bottom{grid-column:1/4;background:var(--panel);border-top:1px solid var(--line);padding:6px 14px 8px}
#ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
#ctl button,#ctl select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:600 12px system-ui;cursor:pointer}
#ctl button.play{background:var(--acc);color:#06222d;min-width:64px}
#ctl .sp{flex:1}#ctl label{color:var(--muted)}
#tl{width:100%;height:54px;display:block;cursor:pointer;border-radius:6px}
#fine{width:100%;margin:4px 0 0;accent-color:var(--acc)}
.ev{border-left:3px solid var(--line);padding:5px 8px;margin:0 0 6px;background:var(--panel2);border-radius:0 6px 6px 0;cursor:pointer}
.ev.now{border-left-color:var(--warn)}.ev.fact{border-left-color:var(--acc)}.ev.hidden-ev{border-left-color:var(--bad)}
.ev .h{display:flex;gap:6px;color:var(--muted);font:600 11px ui-monospace,Consolas,monospace}.ev .h span:last-child{margin-left:auto}
.ev p{margin:3px 0 0}
#sel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:10px}
#sel h4{margin:0 0 2px;font-size:15px}#sel .k{color:var(--muted)}#sel table{border-collapse:collapse;width:100%;margin-top:6px}
#sel td{padding:1px 0;vertical-align:top}#sel td:first-child{color:var(--muted);width:92px}
#sel .truth{margin-top:7px;padding:6px 8px;border:1px dashed var(--bad);border-radius:6px;color:#ffd0cc}
#sel button{margin-top:8px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
.muted{color:var(--muted)}.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 8px;margin-top:4px}
.legend div{display:flex;align-items:center;gap:6px;color:var(--muted)}
@media (max-width:1000px){#app{display:flex;flex-direction:column;height:auto;min-height:100vh}#top{order:0}#mapwrap{order:1;height:62vh;min-height:320px;flex:none}#bottom{order:2}#left{order:3}#right{order:4}#left,#right{border:0;border-top:1px solid var(--line);max-height:none;overflow:visible}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="clock">—<small>loading</small></div>
    <span class="chip" id="port"><span class="dot"></span>Port <b>—</b></span>
    <span class="chip" id="storm" style="display:none">Rafael <b>—</b></span>
    <span class="chip" id="outchip" style="display:none">Customers out <b>—</b></span>
    <div id="alerts"></div>
  </div>
  <div id="left">
    <h3>Perspective</h3>
    <div class="seg" id="persp">
      <button data-p="T" class="on" title="Everything, including hidden events and internal roles">Truth</button>
      <button data-p="P" title="What the public could see: broadcast AIS and ADS-B, public sensors, alerts, published facts">Public</button>
      <button data-p="C" title="Civil authorities: adds dispatch, vehicles, rescues, damage surveys">Civilian</button>
      <button data-p="D" title="Defense: public picture plus base sensors and military activity">DoD</button>
      <button data-p="I" title="Intelligence: adds port surveillance and all detections">IC</button>
    </div>
    <div class="muted" id="pnote" style="margin-top:5px"></div>
    <h3>Layers</h3>
    <div id="layers"></div>
    <h3>Weather</h3>
    <div class="slider"><span>Cloud</span><input type="range" id="o-cloud" min="0" max="100" value="55"><span id="v-cloud">55%</span></div>
    <div class="slider"><span>Rain rate</span><input type="range" id="o-rain" min="0" max="100" value="45"><span id="v-rain">45%</span></div>
    <div class="slider"><span>Rain total</span><input type="range" id="o-acc" min="0" max="100" value="0"><span id="v-acc">0%</span></div>
    <div class="slider"><span>Wind</span><input type="range" id="o-wind" min="0" max="100" value="60"><span id="v-wind">60%</span></div>
    <div class="slider"><span>Surge</span><input type="range" id="o-surge" min="0" max="100" value="55"><span id="v-surge">55%</span></div>
    <div class="slider"><span>Night</span><input type="range" id="o-night" min="0" max="100" value="35"><span id="v-night">35%</span></div>
    <h3>Basemap</h3>
    <div class="seg" id="basesel"><button data-b="sat" class="on">Satellite</button><button data-b="ref">Chart (offline)</button></div>
    <h3>Legend</h3>
    <div class="legend" id="legend"></div>
  </div>
  <div id="mapwrap">
    <canvas id="base" class="ov"></canvas>
    <div id="map"></div>
    <div id="night" class="ov"></div>
    <canvas id="wxc" class="ov"></canvas>
    <canvas id="assets" class="ov"></canvas>
    <div id="tip"></div>
    <div id="loading">loading day…</div>
  </div>
  <div id="right">
    <div id="sel" style="display:none"></div>
    <h3>Events <span class="muted" id="evcount" style="text-transform:none;letter-spacing:0"></span></h3>
    <div class="seg" id="evwin" style="margin-bottom:8px"><button data-w="6">±6 h</button><button data-w="24" class="on">±24 h</button><button data-w="168">±7 d</button><button data-w="0">All so far</button></div>
    <div id="events"></div>
  </div>
  <div id="bottom">
    <div id="ctl">
      <button data-step="-86400" title="Back one day (PgUp)">−1 d</button><button data-step="-3600">−1 h</button><button data-step="-900" title="Back 15 minutes (←)">−15 m</button>
      <button class="play" id="play" title="Space">Play</button>
      <button data-step="900" title="Forward 15 minutes (→)">+15 m</button><button data-step="3600">+1 h</button><button data-step="86400" title="Forward one day (PgDn)">+1 d</button>
      <label>Speed <select id="speed"><option value="300">5 min / s</option><option value="900" selected>15 min / s</option><option value="3600">1 h / s</option><option value="21600">6 h / s</option></select></label>
      <label><input type="checkbox" id="follow"> follow selected</label>
      <span class="sp"></span>
      <span class="muted" id="tlhint">Drag the timeline; ←/→ step 15 minutes</span>
    </div>
    <canvas id="tl"></canvas>
    <input type="range" id="fine" min="0" max="14495" step="1" value="2880" aria-label="Time, 15-minute steps">
  </div>
</div>
